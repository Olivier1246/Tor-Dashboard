{% extends "base.html" %}
{% block title %}Connexion · Tor Relay Dashboard{% endblock %}
{% block content %}
<div class="login-wrap">
  <form class="card login-card" method="post" action="/login" autocomplete="off">
    <div class="login-logo">
      <img src="/static/favicon.svg" alt="" width="48" height="48">
      <h1>Tor Relay Dashboard</h1>
      <p class="muted">Accès réservé · double authentification requise</p>
    </div>

    {% if error %}<div class="alert alert-err">{{ error }}</div>{% endif %}

    <label>Identifiant
      <input type="text" name="username" required autofocus
             autocomplete="username">
    </label>
    <label>Mot de passe
      <input type="password" name="password" required
             autocomplete="current-password">
    </label>
    <label>Code 2FA (TOTP)
      <input type="text" name="totp" inputmode="numeric" pattern="[0-9]*"
             maxlength="6" placeholder="123456" autocomplete="one-time-code">
    </label>

    <button class="btn btn-primary" type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
